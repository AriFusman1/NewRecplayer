# PCAP Player defaults. Don't put your settings or secrets here.
#
# Put them in config/application.yml (copy config/application.example.yml). It is read
# automatically from the working directory (in Docker: /app/config/application.yml), or from the
# file named by CONFIG_FILE, and overrides these defaults.
# Environment variables override both: upper-case the key path and replace '.' and '-' with '_'.
# Example: s3.access-key -> S3_ACCESS_KEY, server.port -> SERVER_PORT.

server:
  host: 0.0.0.0
  port: 8080

storage:
  # s3 | filesystem (filesystem is for local development only)
  type: s3
  filesystem-root: /tmp/pcap-player/store

s3:
  # Empty endpoint = AWS. For MinIO / S3-compatible servers set e.g. http://minio:9000
  endpoint: ""
  region: us-east-1
  bucket: pcap-player
  # Empty keys = AWS default credential chain (env, profile, IRSA, ...)
  access-key: ""
  secret-key: ""
  # true for MinIO and most S3-compatible servers
  path-style: false
  # optional key prefix inside the bucket, e.g. "pcap-player/"
  prefix: ""

# Local scratch space (uploads in progress, cached pcaps). Must be writable by the container user.
work-dir: /tmp/pcap-player
cache:
  max-bytes: 2147483648
upload:
  # an uploaded-but-not-saved file is discarded after this long
  expire-minutes: 120

replay:
  connect-timeout-ms: 5000
  # replays running at the same time, for all users together (waiting for a connection counts)
  max-active-replays: 10
  # records played together that include TCP clients wait this long for all of them to connect
  group-connect-timeout-ms: 300000
  # TCP server records: play even when the target is not listening (or the connection drops); the
  # connection is retried every tcp-retry-interval-ms and messages due meanwhile are not delivered.
  # false = fail the replay with CONNECT_FAILED / CONNECTION_LOST instead.
  tcp-keep-trying: true
  tcp-retry-interval-ms: 1000

extraction:
  fragment-timeout-ms: 30000
  tcp-gap-timeout-ms: 2000
  udp-duplicate-window-ms: 5
  # parsed captures kept in memory (previews, saves and replays reuse them); 0 disables
  cache-max-bytes: 268435456

history:
  size: 20

histogram:
  max-bins: 120
